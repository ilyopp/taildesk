[package]
name = "taildesk"
version = "0.3.0"
description = "Tableau de bord Tailscale - Taildesk"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.7.1"
rfd = "0.15"
tauri-plugin-updater = "2.10.1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
parking_lot = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
