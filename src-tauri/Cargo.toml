[package]
name = "brainconnect"
version = "0.1.0"
description = "Tableau de bord Tailscale — BrainConnect"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.7.1"
ironrdp-blocking = "0.10.0"
x509-cert = "0.3.0"
tokio-rustls = "0.26.4"
sspi = { version = "0.21.3", features = ["network_client"] }
rfd = "0.15"
ironrdp = { version = "0.17.0", features = ["connector", "session", "graphics"] }
tauri-plugin-updater = "2.10.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
